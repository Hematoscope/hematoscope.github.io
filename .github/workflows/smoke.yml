name: Run Smoke Tests

on:
  deployment:

jobs:
  smoke-test:
    name: Smoke Tests against ${{github.event.deployment.environment}}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: contains(github.event.deployment.environment, 'Production')
    permissions:
      contents: read
      deployments: read
    steps:
      # The deployment event fires when the deploy job starts, before Pages
      # has published anything, so the URL only exists once that job reports
      # its final status. Poll this event's own deployment until its newest
      # status carries one.
      - name: Get deployment URL
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        timeout-minutes: 5
        with:
          script: |
            const deploymentId = context.payload.deployment.id;
            for (;;) {
              const { data: statuses } =
                await github.rest.repos.listDeploymentStatuses({
                  ...context.repo,
                  deployment_id: deploymentId,
                  per_page: 1,
                });
              const latest = statuses[0];
              if (latest?.environment_url) {
                core.setOutput("deployment", latest.environment_url);
                core.info(`Deployment URL: ${latest.environment_url}`);
                return;
              }
              if (["error", "failure", "inactive"].includes(latest?.state)) {
                core.setFailed(`Deployment ended as ${latest.state}`);
                return;
              }
              core.info(`No URL yet (${latest?.state ?? "no status"}), retrying`);
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run smoke tests
        run: npm run test:smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.deployment.outputs.deployment }}
