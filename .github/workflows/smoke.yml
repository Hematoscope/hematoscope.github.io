name: Run Smoke Tests

on:
  deployment:

jobs:
  smoke-test:
    name: Smoke Tests against ${{github.event.deployment.environment}}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: contains(github.event.deployment.environment, 'Production')
    steps:
      - name: Get deployment URL
        id: deployment
        # Pinned to an untagged master commit on purpose: the latest tag,
        # v1.0.7, still declares the removed node12 runtime.
        uses: dorshinar/get-deployment-url@a0291e800a64091afcd15f1ea62f96f2f4a0ca65 # master
        timeout-minutes: 5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run smoke tests
        run: npm run test:smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.deployment.outputs.deployment }}
